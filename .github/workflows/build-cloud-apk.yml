name: Build Kémzy cloud APK

on:
  workflow_dispatch:
  push:
    branches: ["feature/cloud-gateway-apk"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Kémzyavatarstudio.apk
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/release/Kémzyavatarstudio.apk > app/build/outputs/apk/release/Kémzyavatarstudio.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kemzyavatar-apk
          path: |
            app/build/outputs/apk/release/Kémzyavatarstudio.apk
            app/build/outputs/apk/release/Kémzyavatarstudio.apk.sha256
          retention-days: 90
