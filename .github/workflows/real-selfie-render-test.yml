name: End-to-end real selfie render test

on:
  push:
    branches:
      - feature/backend-render-gateway

jobs:
  render-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check GPU worker and run real selfie render
        run: |
          set -u
          echo "=== GPU WORKER HEALTH ==="
          curl --silent --show-error --max-time 30 \
            https://silly-blackberry-pharmaceutical-heated.trycloudflare.com/health || true
          echo
          echo "=== RENDER GATEWAY TEST ==="
          status=$(curl --silent --show-error --max-time 240 -o response.json -w "%{http_code}" \
            https://kemzy-liveavatar-api.onrender.com/v1/test/render-real-selfie || true)
          echo "HTTP_STATUS: $status"
          cat response.json || true
          echo
          python - <<'PY'
          import base64, json, pathlib, sys
          data = json.loads(pathlib.Path("response.json").read_text())
          if data.get("status") != "rendered":
              print("RENDER_TEST_FAILED:", data.get("detail", data))
              sys.exit(1)
          raw = base64.b64decode(data["image_base64"], validate=True)
          if not raw.startswith(b"\x89PNG\r\n\x1a\n"):
              print("RENDER_TEST_FAILED: output is not PNG")
              sys.exit(1)
          pathlib.Path("rendered_frame.png").write_bytes(raw)
          print("REAL_SOURCE_BYTES:", data.get("source_bytes"))
          print("OUTPUT_MIME:", data.get("mime_type"))
          print("RENDERED_PNG_BYTES:", len(raw))
          print("REAL_SELFIE_END_TO_END: PASS")
          PY
      - name: Upload rendered frame artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kemzy-real-selfie-render-test
          path: rendered_frame.png
