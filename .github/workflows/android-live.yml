name: Kémzy Android Live Driver

on:
  push:
    branches: ["feature/backend-render-gateway", "feature/fasterliveportrait-kaggle"]
  pull_request:
    branches: ["feature/backend-render-gateway"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest
      - run: PYTHONPATH=. pytest -q backend/tests
      - run: python -m py_compile backend/app/main.py backend/app/gpu_broker.py backend/kaggle_worker/outbound_worker.py
      - run: grep -q 'FasterLivePortrait' backend/kaggle_worker/outbound_worker.py

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle testDebugUnitTest assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Kémzyavatarstudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kemzyavatar-apk
          path: android/app/build/outputs/apk/debug/Kémzyavatarstudio.apk
